<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图书馆座位预约助手</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel auth-panel" id="authPanel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Access</p>
            <h2>系统登录</h2>
            <p>账号由管理员生成，首次使用后绑定一个学号，绑定后不能修改。</p>
          </div>
          <span class="pill" id="authStatus">未登录</span>
        </div>

        <form id="loginForm" class="auth-grid">
          <div class="field">
            <label for="loginUsername">系统账号</label>
            <input id="loginUsername" autocomplete="username" required placeholder="管理员生成的账号" />
          </div>
          <div class="field">
            <label for="loginPassword">系统密码</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="管理员生成的密码" />
          </div>
          <button type="submit" class="primary">登录</button>
        </form>

        <form id="bindForm" class="auth-grid hidden">
          <div class="field">
            <label for="boundStudentId">绑定学号</label>
            <input id="boundStudentId" required placeholder="例如 202300000001" />
          </div>
          <button type="submit" class="primary">绑定</button>
        </form>

        <div id="userBar" class="user-bar hidden">
          <span id="userInfoText"></span>
          <button type="button" class="ghost" id="logoutButton">退出登录</button>
        </div>
      </section>

      <section class="panel control-panel">
        <div class="masthead">
          <div>
            <p class="eyebrow">QDHHC Library</p>
            <h1>座位预约助手</h1>
          </div>
          <div class="clock" id="clock">--:--:--</div>
        </div>

        <form id="taskForm" class="form-grid">
          <div class="field span-2">
            <label for="taskName">任务名称</label>
            <input id="taskName" name="taskName" maxlength="40" autocomplete="off" placeholder="不填则自动命名为任务1、任务2、任务3" />
          </div>
          <div class="field span-2">
            <label for="account">已绑定学号</label>
            <input id="account" name="account" readonly required placeholder="请先登录并绑定学号" />
          </div>
          <div class="field span-2">
            <label for="password">统一认证密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="统一身份认证密码" />
          </div>

          <div class="field span-2">
            <label for="startTime">开始抢座时间</label>
            <input id="startTime" name="startTime" type="time" required step="60" />
          </div>
          <div class="field span-2">
            <label>执行时间</label>
            <div class="segmented schedule-mode" role="radiogroup" aria-label="执行时间">
              <label><input type="radio" name="scheduleType" value="daily" checked /> 每日执行</label>
              <label><input type="radio" name="scheduleType" value="weekly" /> 自定义每周执行</label>
            </div>
            <div class="weekday-picker hidden" id="weekdayPicker" aria-label="每周执行日期">
              <label><input type="checkbox" name="weekdays" value="1" /> 周一</label>
              <label><input type="checkbox" name="weekdays" value="2" /> 周二</label>
              <label><input type="checkbox" name="weekdays" value="3" /> 周三</label>
              <label><input type="checkbox" name="weekdays" value="4" /> 周四</label>
              <label><input type="checkbox" name="weekdays" value="5" /> 周五</label>
              <label><input type="checkbox" name="weekdays" value="6" /> 周六</label>
              <label><input type="checkbox" name="weekdays" value="0" /> 周日</label>
            </div>
          </div>
          <div class="field">
            <label for="seatNo">座位号</label>
            <input id="seatNo" name="seatNo" required placeholder="例如 036" />
          </div>
          <div class="field">
            <label for="roomId">阅览区</label>
            <select id="roomId" name="roomId">
              <option value="">自动识别</option>
            </select>
          </div>
          <div class="field">
            <label for="seatNoAlt1">备选座位 1</label>
            <input id="seatNoAlt1" name="seatNoAlt1" placeholder="主座位失败后尝试" />
          </div>
          <div class="field">
            <label for="seatNoAlt2">备选座位 2</label>
            <input id="seatNoAlt2" name="seatNoAlt2" placeholder="备选 1 失败后尝试" />
          </div>

          <div class="field span-2">
            <label>执行方式</label>
            <div class="segmented" role="radiogroup" aria-label="执行方式">
              <label><input type="radio" name="mode" value="browser" checked /> 登录后读取座位图提交</label>
            </div>
          </div>
          <label class="checkline span-2">
            <input id="visibleBrowser" type="checkbox" checked />
            <span>执行时显示浏览器窗口，便于处理登录状态和人工确认</span>
          </label>

          <div class="segments span-2">
            <div class="section-head">
              <div>
                <h2>预约时间段</h2>
                <p>结束时间默认填为开始时间后 3 小时；每段最长 16 小时，可手动修改。</p>
              </div>
              <button type="button" class="ghost" id="addSegment">添加时间段</button>
            </div>
            <div id="segments"></div>
          </div>

          <div class="actions span-2">
            <button type="submit" class="primary">创建定时任务</button>
            <button type="button" class="secondary" id="previewSeat">检查座位匹配</button>
            <button type="button" class="secondary" id="refreshMenu">刷新阅览区</button>
          </div>
        </form>
      </section>

      <section class="panel status-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Runtime</p>
            <h2>任务与日志</h2>
          </div>
          <span class="pill" id="serverStatus">连接中</span>
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="log-box" id="logBox"></div>
        <div class="log-actions">
          <button type="button" class="secondary" id="clearLogs">清空日志</button>
        </div>
      </section>
    </main>

    <template id="segmentTemplate">
      <div class="segment-row">
        <div class="field">
          <label>日期</label>
          <input class="seg-date" type="date" required />
        </div>
        <div class="field">
          <label>开始</label>
          <input class="seg-begin" type="time" required step="60" />
        </div>
        <div class="field">
          <label>结束</label>
          <input class="seg-end" type="time" required step="60" />
        </div>
        <button type="button" class="icon-btn remove-seg" aria-label="删除时间段">×</button>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
