<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账号管理 - 图书馆座位预约助手</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="panel admin-login-panel" id="adminLoginPanel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Admin</p>
            <h1>账号管理</h1>
          </div>
          <a class="text-link" href="/">返回预约页</a>
        </div>

        <form id="adminLoginForm" class="admin-login-form">
          <div class="field">
            <label for="adminUsername">管理员账号</label>
            <input id="adminUsername" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="adminPassword">管理员密码</label>
            <input id="adminPassword" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="primary">进入管理页</button>
        </form>
        <div class="admin-message" id="adminLoginMessage"></div>
      </section>

      <section class="panel admin-workspace hidden" id="adminWorkspace">
        <div class="section-head">
          <div>
            <p class="eyebrow">Control Center</p>
            <h1>系统管理</h1>
            <p id="adminInfoText"></p>
          </div>
          <div class="admin-top-actions">
            <a class="text-link" href="/">返回预约页</a>
            <button type="button" class="ghost" id="adminLogoutButton">退出管理员</button>
          </div>
        </div>

        <nav class="admin-feature-bar" aria-label="管理功能">
          <button type="button" class="admin-feature-tab active" data-admin-view="accounts" aria-selected="true">
            账号管理 <span id="accountCount">0</span>
          </button>
          <button type="button" class="admin-feature-tab" data-admin-view="tasks" aria-selected="false">
            用户任务 <span id="taskCount">0</span>
          </button>
        </nav>

        <div class="admin-view" id="adminAccountsView">
          <form id="createUserForm" class="admin-create-form">
            <div class="field">
              <label for="newUsername">系统账号</label>
              <input id="newUsername" required placeholder="3-32 位字母、数字、下划线或横线" />
            </div>
            <div class="field">
              <label for="newPassword">系统密码</label>
              <input id="newPassword" placeholder="留空自动生成" />
            </div>
            <button type="submit" class="primary">生成账号</button>
          </form>

          <div class="admin-message" id="adminMessage"></div>

          <div class="managed-users-head">
            <span>系统账号</span>
            <span>初始密码</span>
            <span>绑定学号</span>
            <span>创建时间</span>
            <span></span>
          </div>
          <div class="managed-users admin-users-list" id="managedUsers"></div>
        </div>

        <section class="admin-view hidden" id="adminTasksView">
          <div class="admin-view-head">
            <div>
              <h2>全部用户任务</h2>
              <p id="taskSummary">正在读取任务...</p>
            </div>
            <button type="button" class="secondary admin-refresh" id="refreshAdminTasks">刷新任务</button>
          </div>
          <div class="admin-message" id="adminTasksMessage"></div>
          <div class="admin-task-users" id="managedTasks"></div>
        </section>
      </section>
    </main>

    <script src="/admin.js" type="module"></script>
  </body>
</html>
