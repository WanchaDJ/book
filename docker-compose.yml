services:
  library-seat-reserver:
    build: .
    image: library-seat-reserver:latest
    container_name: library-seat-reserver
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FORCE_HEADLESS: "true"
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      SESSION_SECRET: "change-this-session-secret"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-this-admin-password"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
